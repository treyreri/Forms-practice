<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
</head>
<body>
    <h1>Contact form</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <p>
            {{form.name.label}}
            {{ form.name }}
            {{ form.name.errors }}
        </p>

        <button type="submit">Send</button>
    </form>
</body>
</html>
